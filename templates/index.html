<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amnesia Provisioning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; color: #333; margin-bottom: 10px; }
        .header p { color: #666; }
        .panel { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #333; }
        button { background: #007AFF; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0051D5; }
        #qr-container { text-align: center; margin: 20px 0; }
        #qr-image { max-width: 300px; }
        .client-list { list-style: none; }
        .client-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .client-item:last-child { border-bottom: none; }
        .client-id { font-family: monospace; color: #666; }
        .client-buttons { display: flex; gap: 10px; }
        .btn-small { padding: 8px 16px; font-size: 12px; }
        .btn-danger { background: #FF3B30; }
        .btn-danger:hover { background: #CC0000; }
        .btn-secondary { background: #8E8E93; }
        .btn-secondary:hover { background: #6C6C70; }
        .status { padding: 10px 15px; border-radius: 6px; text-align: center; margin-top: 10px; }
        .status-success { background: #D1E7DD; color: #0F5132; }
        .status-error { background: #F8D7DA; color: #842029; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Amnesia Provisioning</h1>
            <p>AmneziaWG Premium Delivery</p>
        </div>
        <div class="panel">
            <div class="section-title">Create New Client</div>
            <button onclick="createClient()">Generate New Configuration</button>
            <div id="status"></div>
            <div id="qr-container"></div>
            <div id="conf-link"></div>
        </div>
        <div class="panel">
            <div class="section-title">Active Clients</div>
            <ul class="client-list" id="client-list">
                <li class="client-item"><span>Loading...</span></li>
            </ul>
        </div>
    </div>
    <script>
        async function createClient() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '<div class="status">Creating...</div>';
            try {
                const res = await fetch('/provision', { method: 'POST' });
                const data = await res.json();
                if (data.client_id) {
                    statusEl.innerHTML = `<div class="status status-success">✓ Created: ${data.client_id}</div>`;
                    document.getElementById('qr-container').innerHTML = `<img id="qr-image" src="/qr/${data.client_id}" alt="QR Code">`;
                    document.getElementById('conf-link').innerHTML = `<div style="text-align: center; margin-top: 15px;"><a href="/conf/${data.client_id}" style="color: #007AFF;">Download .conf</a></div>`;
                    loadClients();
                } else {
                    statusEl.innerHTML = `<div class="status status-error">Error: ${data.detail}</div>`;
                }
            } catch (err) {
                statusEl.innerHTML = `<div class="status status-error">Error: ${err.message}</div>`;
            }
        }
        async function loadClients() {
            try {
                const res = await fetch('/clients');
                const clients = await res.json();
                const list = document.getElementById('client-list');
                if (clients.length === 0) {
                    list.innerHTML = '<li class="client-item"><span>No clients yet</span></li>';
                    return;
                }
                list.innerHTML = clients.map(c => `<li class="client-item"><div><div class="client-id">${c.client_id}</div><div style="font-size: 12px; color: #999;">${c.created_at}</div></div><div class="client-buttons"><button class="btn-small btn-secondary" onclick="downloadConf('${c.client_id}')">Download</button><button class="btn-small btn-danger" onclick="revokeClient('${c.client_id}')">Revoke</button></div></li>`).join('');
            } catch (err) {
                console.error(err);
            }
        }
        function downloadConf(clientId) {
            window.open(`/conf/${clientId}`, '_blank');
        }
        async function revokeClient(clientId) {
            if (!confirm('Revoke access for ' + clientId + '?')) return;
            try {
                await fetch(`/revoke/${clientId}`, { method: 'DELETE' });
                loadClients();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        loadClients();
    </script>
</body>
</html>
